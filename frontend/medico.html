<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Painel Veterinário</title>

  <link rel="stylesheet" href="css/style.css">

  <style>

    body {
      background: #DCEEFF;
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 25px;
    }

    h2,
    h3 {
      color: #2C5D8A;
    }

    .btn-tv {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      margin-left: 8px;
    }

    .btn-tv:hover {
      background: #218838;
    }

    /* BOTÃO INTERAÇÃO */
    .btn-interacao {
      background: #5B9BD5;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      margin-left: 8px;
    }

    .btn-interacao:hover {
      background: #468CC7;
    }

    .btn-pdf {
      background: #6f42c1;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-pdf:hover {
      background: #5a32a3;
    }

    .btn-alta {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-alta:hover {
      background: #218838;
    }

    .btn-salvar {
      background: #5B9BD5;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-salvar:hover {
      background: #468CC7;
    }

  </style>
</head>

<body>

  <div class="container">

    <header>

      <h2>🐾 Painel Veterinário</h2>

      <button
        class="btn-tv"
        onclick="window.open('tv.html','_blank')">
        📺 Abrir Tela da TV
      </button>

    </header>

    <hr>

    <!-- SELEÇÃO DO PACIENTE -->

    <h3>Paciente</h3>

    <select id="paciente">
      <option value="">Selecione um paciente</option>
    </select>

    <button onclick="atenderPaciente()">
      Atender
    </button>

    <br><br>

    <!-- DADOS DO PACIENTE -->

    <div id="dadosPaciente">

      <label>
        Nome:
        <input type="text" id="nome">
      </label>

      <br><br>

      <label>
        Espécie:
        <input type="text" id="especie">
      </label>

      <br><br>

      <label>
        Raça:
        <input type="text" id="raca">
      </label>

      <br><br>

      <label>
        Cor:
        <input type="text" id="cor">
      </label>

      <br><br>

      <label>
        Alergia:
        <input type="text" id="alergia">
      </label>

      <br><br>

      <label>
        Tutor:
        <input type="text" id="tutor">
      </label>

    </div>

    <br>

    <!-- CONSULTA -->

    <h3>Consulta</h3>

    <textarea
      id="consulta"
      rows="8"
      style="width:100%;"
      placeholder="Digite as informações da consulta..."></textarea>

    <br><br>

    <!-- BOTÕES -->

    <div class="acoes">

      <button
        class="btn-pdf"
        onclick="gerarPDF()">
        📄 Baixar PDF
      </button>

      <button
        class="btn-alta"
        onclick="abrirAlta()">
        🏠 Dar Alta
      </button>

      <button
        class="btn-salvar"
        onclick="salvarConsulta()">
        💾 Salvar Consulta
      </button>

      <!-- INTERAÇÃO JUNTO DOS OUTROS BOTÕES -->
      <button
        class="btn-interacao"
        onclick="abrirInteracao()">
        🔗 Interação
      </button>

    </div>

  </div>

  <script>

    /* ==============================
       INTERAÇÃO
    ============================== */

    function abrirInteracao() {

      const paciente =
        document.getElementById("paciente").value.trim();

      const parametros = new URLSearchParams();

      if (paciente) {
        parametros.set("paciente", paciente);
      }

      const url =
        "interação.html" +
        (parametros.toString()
          ? "?" + parametros.toString()
          : "");

      window.open(url, "_blank");

    }

  </script>

</body>

</html>
