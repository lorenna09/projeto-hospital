<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Painel Veterinário</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- Biblioteca para gerar PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>

    body {
      background: #DCEEFF;
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 25px;
    }

    h2,
    h3 {
      color: #2C5D8A;
    }

    .btn-tv {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn-tv:hover {
      background: #1e7e34;
    }

    .btn-abrir-tv {
      background: #5B9BD5;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-abrir-tv:hover {
      background: #468CC7;
    }

    .consultorio-input {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      background: #EEF7FF;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #C9E2F5;
    }

    .consultorio-input label {
      font-weight: bold;
      color: #2C5D8A;
    }

    .consultorio-input input {
      width: 60px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 5px 8px;
      border: 1px solid #BFD5E5;
      border-radius: 6px;
    }

    .card {
      background: #F7FBFF;
      border: 1px solid #D5E8F7;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    input,
    select,
    textarea {
      border: 1px solid #C9DDEA;
      border-radius: 9px;
      padding: 11px;
      box-sizing: border-box;
    }

    textarea {
      width: 100%;
      min-height: 100px;
    }

    button {
      border-radius: 9px;
    }

    /* Área da consulta */

    #consultaPDF {
      background: #F7FBFF;
      border: 1px solid #D5E8F7;
      border-radius: 15px;
      padding: 20px;
      margin-top: 15px;
    }

    #consultaPDF input,
    #consultaPDF select {
      width: 100%;
      margin-bottom: 10px;
    }

    /* Botão PDF */

    .btn-pdf {
      background: #2C5D8A;
      color: white;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      margin-top: 10px;
    }

    .btn-pdf:hover {
      background: #21496d;
    }

    /* Impressão */

    @media print {

      body {
        background: white !important;
      }

      body * {
        visibility: hidden;
      }

      #consultaPDF,
      #consultaPDF * {
        visibility: visible;
      }

      #consultaPDF {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        border: none;
        box-shadow: none;
        background: white;
      }

      #consultaPDF button {
        display: none !important;
      }

    }

  </style>
</head>

<body>

<div class="container">

  <!-- CABEÇALHO -->

  <div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  ">

    <h2 style="margin:0;">
      🐾💙 Painel Veterinário 🐶🐱
    </h2>

    <button
      class="btn-abrir-tv"
      onclick="window.open('tv.html','_blank')">

      📺 Abrir Tela da TV

    </button>

  </div>


  <!-- CONSULTÓRIO -->

  <div class="consultorio-input">

    <label>Meu Consultório:</label>

    <input
      type="text"
      id="consultorio-num"
      value="01"
    >

    <span style="color:#666; font-size:13px;">
      Este número será exibido na TV ao chamar o paciente.
    </span>

  </div>


  <!-- FILA DE TRIAGEM -->

  <div id="triagens"></div>


  <hr>


  <!-- CONSULTA VETERINÁRIA -->

  <div id="consultaPDF">

    <h3>🩺 Consulta Veterinária</h3>

    <input
      id="paciente"
      placeholder="Paciente"
      readonly
    >

    <input
      id="diagnostico"
      placeholder="Diagnóstico"
    >

    <select id="medicacao">

      <option value="">
        Selecione a medicação
      </option>

    </select>

    <textarea
      id="obs"
      placeholder="Observações"></textarea>


    <!-- BOTÕES -->

    <div style="
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    ">

      <button onclick="salvar()">
        🐾 Salvar Consulta
      </button>

      <button
        class="btn-pdf"
        onclick="baixarPDF()">

        📄 Baixar PDF

      </button>

    </div>

  </div>

</div>


<script>

let triagensCarregadas = [];


/* =========================
   CARREGAR TRIAGENS
========================= */

function carregar() {

  fetch("/triagens")

    .then(r => r.json())

    .then(data => {

      triagensCarregadas = data;

      const div =
        document.getElementById("triagens");

      div.innerHTML = "";

      if (data.length === 0) {

        div.innerHTML =
          "<p style='color:#888; text-align:center;'>🐾 Nenhum paciente na fila.</p>";

        return;
      }

      data.forEach((t, index) => {

        div.innerHTML += `

          <div class="card">

            <h3>🐶 ${t.nome}</h3>

            <p>
              <b>🩺 Sintoma:</b>
              ${t.sintoma || "Não informado"}
            </p>

            <p>
              <b>🌡️ Temperatura:</b>
              ${t.temperatura || "Não informada"}°C
            </p>

            <p>
              <b>🚦 Risco:</b>
              <span class="${t.risco}">
                ${t.risco}
              </span>
            </p>

            <p>
              <b>⚠️ Alergia:</b>
              ${t.alergia || "Nenhuma"}
            </p>

            <p>
              <b>📝 Observação:</b>
              ${t.observacao || "Nenhuma"}
            </p>

            <div style="
              display:flex;
              gap:8px;
              flex-wrap:wrap;
            ">

              <button onclick="selecionar(${index})">
                🐾 Atender
              </button>

              <button
                class="btn-tv"
                onclick="chamarNaTV('${t.nome}')">

                📺 Chamar na TV

              </button>

            </div>

          </div>

        `;

      });

    })

    .catch(error => {

      console.error(
        "Erro ao carregar triagens:",
        error
      );

    });

}


/* =========================
   CHAMAR NA TV
========================= */

function chamarNaTV(nome) {

  const consultorio =
    document.getElementById("consultorio-num").value || "01";

  fetch("/tv/chamar", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      localTipo: "CONSULTÓRIO",

      localNumero: consultorio,

      paciente: nome

    })

  })

  .then(r => r.json())

  .then(() => {

    alert(
      "✅ " +
      nome +
      " foi chamado na TV para o Consultório " +
      consultorio +
      "!"
    );

  });

}


/* =========================
   SELECIONAR PACIENTE
========================= */

function selecionar(index) {

  const t =
    triagensCarregadas[index];

  document.getElementById("paciente").value =
    t.nome;

  document.getElementById("obs").value =
    t.observacao || "";

  if (
    t.alergia &&
    t.alergia !== "Nenhuma"
  ) {

    alert(
      "⚠️ Paciente possui alergia: " +
      t.alergia
    );

  }

}


/* =========================
   CARREGAR MEDICAÇÕES
========================= */

function carregarMedicacoes() {

  fetch("/lista-medicacoes")

    .then(r => r.json())

    .then(data => {

      const select =
        document.getElementById("medicacao");

      select.innerHTML =
        `<option value="">Selecione a medicação</option>`;

      data.forEach(med => {

        const option =
          document.createElement("option");

        option.value = med;

        option.textContent = med;

        select.appendChild(option);

      });

    });

}


/* =========================
   SALVAR CONSULTA
========================= */

function salvar() {

  const paciente =
    document.getElementById("paciente").value;

  const diagnostico =
    document.getElementById("diagnostico").value;

  const medicacao =
    document.getElementById("medicacao").value;

  const obs =
    document.getElementById("obs").value;


  if (!paciente) {

    alert(
      "Selecione um paciente clicando em Atender."
    );

    return;
  }


  if (!medicacao) {

    alert(
      "Selecione uma medicação."
    );

    return;
  }


  fetch("/consulta", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      paciente,
      diagnostico,
      medicacao,
      obs

    })

  })

  .then(r => r.json())

  .then(() => {

    alert(
      "🐾 Consulta salva com sucesso!"
    );

    document.getElementById("diagnostico").value = "";

    document.getElementById("medicacao").value = "";

    document.getElementById("obs").value = "";

  })

  .catch(error => {

    console.error(error);

    alert(
      "❌ Erro ao salvar consulta."
    );

  });

}


/* =========================
   BAIXAR PDF
   SOMENTE CONSULTA
========================= */

function baixarPDF() {

  const paciente =
    document.getElementById("paciente").value;

  const diagnostico =
    document.getElementById("diagnostico").value;

  const medicacao =
    document.getElementById("medicacao").value;

  const obs =
    document.getElementById("obs").value;


  if (!paciente) {

    alert(
      "⚠️ Selecione um paciente primeiro."
    );

    return;
  }


  const { jsPDF } = window.jspdf;

  const doc = new jsPDF();


  /* DATA E HORA */

  const agora = new Date();

  const data =
    agora.toLocaleDateString("pt-BR");

  const hora =
    agora.toLocaleTimeString("pt-BR");


  /* CABEÇALHO */

  doc.setFillColor(
    44,
    93,
    138
  );

  doc.rect(
    0,
    0,
    210,
    32,
    "F"
  );


  doc.setTextColor(
    255,
    255,
    255
  );

  doc.setFontSize(20);

  doc.text(
    "Painel Veterinário",
    20,
    21
  );


  /* TÍTULO */

  doc.setTextColor(
    0,
    0,
    0
  );

  doc.setFontSize(16);

  doc.text(
    "Consulta Veterinária",
    20,
    48
  );


  /* DATA */

  doc.setFontSize(10);

  doc.text(
    "Data: " + data,
    20,
    58
  );

  doc.text(
    "Hora: " + hora,
    130,
    58
  );


  /* LINHA */

  doc.setDrawColor(
    200,
    200,
    200
  );

  doc.line(
    20,
    64,
    190,
    64
  );


  let y = 80;


  /* PACIENTE */

  doc.setFontSize(12);

  doc.setFont(undefined, "bold");

  doc.text(
    "Paciente:",
    20,
    y
  );

  doc.setFont(undefined, "normal");

  doc.text(
    paciente,
    55,
    y
  );


  y += 20;


  /* DIAGNÓSTICO */

  doc.setFont(undefined, "bold");

  doc.text(
    "Diagnóstico:",
    20,
    y
  );

  doc.setFont(undefined, "normal");

  y += 8;

  const textoDiagnostico =
    doc.splitTextToSize(
      diagnostico || "Não informado",
      165
    );

  doc.text(
    textoDiagnostico,
    20,
    y
  );


  y +=
    textoDiagnostico.length * 6 +
    15;


  /* MEDICAÇÃO */

  doc.setFont(undefined, "bold");

  doc.text(
    "Medicação:",
    20,
    y
  );

  doc.setFont(undefined, "normal");

  y += 8;

  const textoMedicacao =
    doc.splitTextToSize(
      medicacao || "Não informada",
      165
    );

  doc.text(
    textoMedicacao,
    20,
    y
  );


  y +=
    textoMedicacao.length * 6 +
    15;


  /* OBSERVAÇÕES */

  doc.setFont(undefined, "bold");

  doc.text(
    "Observações:",
    20,
    y
  );

  doc.setFont(undefined, "normal");

  y += 8;

  const textoObs =
    doc.splitTextToSize(
      obs || "Nenhuma observação",
      165
    );

  doc.text(
    textoObs,
    20,
    y
  );


  /* RODAPÉ */

  doc.setFontSize(9);

  doc.setTextColor(
    100,
    100,
    100
  );

  doc.text(
    "Documento gerado pelo Painel Veterinário",
    20,
    285
  );


  /* NOME DO ARQUIVO */

  let nomeArquivo =
    paciente
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-zA-Z0-9 ]/g, "")
      .trim()
      .replace(/\s+/g, "_");


  doc.save(
    "Consulta_" +
    nomeArquivo +
    "_" +
    data.replace(/\//g, "-") +
    ".pdf"
  );

}


/* =========================
   INICIAR
========================= */

carregar();

carregarMedicacoes();

setInterval(
  carregar,
  10000
);

</script>

</body>
</html>
