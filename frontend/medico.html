<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Painel Veterinário</title>

<link rel="stylesheet" href="css/style.css">

<style>

body {
  background: #DCEEFF;
  font-family: Arial, sans-serif;
  margin: 0;
  min-height: 100vh;
}

.container {
  width: 90%;
  max-width: 1000px;
  margin: 40px auto;
  background: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.10);
}

h2 {
  color: #2C5D8A;
}

h3 {
  color: #2C5D8A;
}

.card {
  background: #F7FBFF;
  border: 1px solid #D6E5F5;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
}

.info-animal {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px 25px;
  margin-top: 15px;
}

.info-animal p {
  margin: 6px 0;
}

.alerta {
  background: #FFF3CD;
  border: 1px solid #FFE08A;
  padding: 12px;
  border-radius: 8px;
  margin-top: 12px;
}

.btn-tv {
  background: #28a745;
  color: white;
  border: none;
  padding: 9px 14px;
  border-radius: 6px;
  cursor: pointer;
}

.btn-tv:hover {
  background: #1e7e34;
}

.btn-abrir-tv {
  background: #17a2b8;
  color: white;
  border: none;
  padding: 9px 16px;
  border-radius: 6px;
  cursor: pointer;
}

.btn-abrir-tv:hover {
  background: #117a8b;
}

.consultorio-input {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  background: #F0F4FF;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #D0D8F0;
}

.consultorio-input input {
  width: 60px;
  text-align: center;
  font-size: 17px;
  font-weight: bold;
  padding: 6px;
}

.formulario {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.formulario input,
.formulario select,
.formulario textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid #CCC;
  border-radius: 8px;
  font-size: 15px;
}

.formulario textarea {
  min-height: 100px;
  resize: vertical;
}

.btn-salvar {
  width: 100%;
  padding: 13px;
  background: #5B9BD5;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

.btn-salvar:hover {
  background: #468CC7;
}

.botoes {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 15px;
}

</style>

</head>


<body>

<div class="container">

<!-- CABEÇALHO -->

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
">

<h2 style="margin:0;">
🐾 Painel Veterinário
</h2>

<button
class="btn-abrir-tv"
onclick="window.open('tv.html','_blank')">

📺 Abrir Tela da TV

</button>

</div>


<!-- CONSULTÓRIO -->

<div class="consultorio-input">

<label>
<b>Meu Consultório:</b>
</label>

<input
type="text"
id="consultorio-num"
value="01"
maxlength="3"
>

<span style="color:#666;font-size:13px;">
Número exibido na TV ao chamar o animal.
</span>

</div>


<!-- LISTA -->

<div id="triagens"></div>


<hr>


<!-- CONSULTA -->

<h3>
🩺 Consulta Veterinária
</h3>


<div class="formulario">

<label>
Animal selecionado
</label>

<input
id="paciente"
placeholder="Animal"
readonly
>


<label>
Diagnóstico
</label>

<input
id="diagnostico"
placeholder="Digite o diagnóstico"
>


<label>
Medicação
</label>

<select id="medicacao">

<option value="">
Selecione a medicação
</option>

</select>


<label>
Observações da consulta
</label>

<textarea
id="obs"
placeholder="Digite as observações da consulta">
</textarea>


<button
class="btn-salvar"
onclick="salvar()">

💾 Salvar Consulta

</button>

</div>

</div>


<script>

let triagensCarregadas = [];


/* ========================= */
/* CARREGAR ANIMAIS */
/* ========================= */

function carregar() {

fetch("/triagens")

.then(r => r.json())

.then(data => {

triagensCarregadas = data;

const div =
document.getElementById("triagens");

div.innerHTML = "";


if (data.length === 0) {

div.innerHTML = `
<p style="
color:#888;
text-align:center;
">
🐾 Nenhum animal na fila.
</p>
`;

return;

}


data.forEach((t,index) => {

div.innerHTML += `

<div class="card">

<h3>
🐾 ${t.nomeAnimal || t.nome || "Animal não informado"}
</h3>


<h4>
🐶 Dados do Animal
</h4>


<div class="info-animal">

<p>
<b>Espécie:</b>
${t.especie || "Não informada"}
</p>

<p>
<b>Raça:</b>
${t.raca || "Não informada"}
</p>

<p>
<b>Data de nascimento:</b>
${t.dataNascimento || "Não informada"}
</p>

<p>
<b>Sexo:</b>
${t.sexo || "Não informado"}
</p>

<p>
<b>Peso:</b>
${t.peso ? t.peso + " kg" : "Não informado"}
</p>

<p>
<b>Cor do pelo:</b>
${t.cor || "Não informada"}
</p>

<p>
<b>Tipo sanguíneo:</b>
${t.tipoSanguineo || "Desconhecido"}
</p>

</div>


<h4>
👤 Dados do Tutor
</h4>


<p>
<b>Nome:</b>
${t.nomeTutor || "Não informado"}
</p>

<p>
<b>Documento:</b>
${t.documentoTutor || "Não informado"}
</p>

<p>
<b>Telefone:</b>
${t.codigoPais || ""}
${t.ddd ? "(" + t.ddd + ")" : ""}
${t.telefone || "Não informado"}
</p>

<p>
<b>E-mail:</b>
${t.emailTutor || "Não informado"}
</p>

<p>
<b>Endereço:</b>
${t.endereco || "Não informado"}
</p>

<p>
<b>Contato de emergência:</b>
${t.contatoEmergencia || "Não informado"}
</p>


<div class="alerta">

<b>⚠️ Alergias:</b>

${t.alergias || "Nenhuma informada"}

</div>


<p>
<b>📝 Observações:</b>
${t.observacoes || t.observacao || "Nenhuma"}
</p>


<p>
<b>💳 Atendimento:</b>
${t.tipo || "Não informado"}
</p>


<div class="botoes">

<button
onclick="selecionar(${index})">

🩺 Atender

</button>


<button
class="btn-tv"
onclick="chamarNaTV('${(t.nomeAnimal || t.nome || "").replace(/'/g,"\\'")}')">

📺 Chamar na TV

</button>

</div>

</div>

`;

});

});

}


/* ========================= */
/* CHAMAR NA TV */
/* ========================= */

function chamarNaTV(nome) {

const consultorio =
document.getElementById("consultorio-num").value || "01";


fetch("/tv/chamar", {

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

localTipo:"CONSULTÓRIO",

localNumero:consultorio,

paciente:nome

})

})

.then(r => r.json())

.then(() => {

alert(
"✅ " +
nome +
" foi chamado para o Consultório " +
consultorio +
"!"
);

});

}


/* ========================= */
/* SELECIONAR ANIMAL */
/* ========================= */

function selecionar(index) {

const t =
triagensCarregadas[index];


const nome =
t.nomeAnimal ||
t.nome ||
"Animal";


document.getElementById("paciente").value =
nome;


document.getElementById("obs").value =
t.observacoes ||
t.observacao ||
"";


if (
t.alergias &&
t.alergias !== "Nenhuma"
) {

alert(
"⚠️ ATENÇÃO!\n\n" +
nome +
" possui alergia: " +
t.alergias
);

}

}


/* ========================= */
/* MEDICAÇÕES */
/* ========================= */

function carregarMedicacoes() {

fetch("/lista-medicacoes")

.then(r => r.json())

.then(data => {

const select =
document.getElementById("medicacao");


select.innerHTML =
`
<option value="">
Selecione a medicação
</option>
`;


data.forEach(med => {

const option =
document.createElement("option");

option.value = med;

option.textContent = med;

select.appendChild(option);

});

})

.catch(() => {

console.log(
"Não foi possível carregar a lista de medicações."
);

});

}


/* ========================= */
/* SALVAR CONSULTA */
/* ========================= */

function salvar() {

const paciente =
document.getElementById("paciente").value;

const diagnostico =
document.getElementById("diagnostico").value;

const medicacao =
document.getElementById("medicacao").value;

const obs =
document.getElementById("obs").value;


if (!paciente) {

alert(
"⚠️ Selecione um animal clicando em Atender."
);

return;

}


if (!diagnostico) {

alert(
"⚠️ Informe o diagnóstico."
);

return;

}


if (!medicacao) {

alert(
"⚠️ Selecione uma medicação."
);

return;

}


fetch("/consulta", {

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

paciente,
diagnostico,
medicacao,
obs

})

})

.then(r => r.json())

.then(() => {

alert(
"✅ Consulta veterinária salva com sucesso!"
);


document.getElementById("diagnostico").value = "";

document.getElementById("medicacao").value = "";

document.getElementById("obs").value = "";

});

}


/* ========================= */
/* INICIAR */
/* ========================= */

carregar();

carregarMedicacoes();


/* Atualiza a fila */

setInterval(carregar,10000);

</script>

</body>

</html>
