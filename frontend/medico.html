```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Painel Veterinário</title>

  <link rel="stylesheet" href="css/style.css">

  <style>

    body {
      background: #DCEEFF;
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 25px;
    }

    h2,
    h3 {
      color: #2C5D8A;
    }

    .btn-tv {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn-tv:hover {
      background: #1e7e34;
    }

    .btn-abrir-tv {
      background: #5B9BD5;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;

      cursor: pointer;
    }

    .btn-abrir-tv:hover {
      background: #468CC7;

    .consultorio-input {
      display: flex;
      align-items: center;

      border-radius: 10px;
      border: 1px solid #C9E2F5;
    }

    .consultorio-input label {
      font-weight: bold;
      color: #2C5D8A;
    }

    .consultorio-input input {
      width: 60px;
      text-align: center;

      border: 1px solid #D5E8F7;

    }

    select,
    textarea {
      border: 1px solid #C9DDEA;

    input,
    select,
    textarea {
      width: 100%;

      min-height: 100px;
      resize: vertical;

      margin-top: 18px;

    .campo-alta label {

      padding: 10px 20px;

      cursor: pointer;

    .btn-alta {

</head>


<body>

<div class="container">

  <!-- CABEÇALHO -->

  <div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  ">

    <h2 style="margin:0;">
      🐾💙 Painel Veterinário 🐶🐱
    </h2>

    <button
      class="btn-abrir-tv"
      onclick="window.open('tv.html','_blank')">

      📺 Abrir Tela da TV

    </button>

  </div>


  <!-- CONSULTÓRIO -->

  <div class="consultorio-input">

    <label>Meu Consultório:</label>

    <input
      type="text"
      id="consultorio-num"
      value="01"
    >

    <span style="color:#666; font-size:13px;">
      Este número será exibido na TV ao chamar o paciente.
    </span>

  </div>


  <!-- FILA DE PACIENTES -->

  <div id="triagens"></div>


  <hr>


  <!-- CONSULTA -->

  <h3>🩺 Consulta Veterinária</h3>


  <input
    id="paciente"
    placeholder="Paciente"
    readonly
  >


  <input
    id="diagnostico"
    placeholder="Diagnóstico"
  >


  <select id="medicacao">

    <option value="">
      Selecione a medicação
    </option>

  </select>


  <textarea
    id="obs"
    placeholder="Observações"></textarea>


  <!-- DADOS DA ALTA -->

  <div class="campo-alta">

    <h3>
      🏠 Dados da Alta
    </h3>


    <label for="motivoAlta">
      Motivo da alta:
    </label>

    <textarea
      id="motivoAlta"
      placeholder="Digite o motivo da alta do paciente..."
    ></textarea>


    <label for="assinatura">
      Médico/Veterinário responsável:
    </label>

    <input
      type="text"
      id="assinatura"
      placeholder="Digite o nome do médico/veterinário"
    >

  </div>


  <!-- BOTÕES -->

  <div class="botoes-consulta">

    <button
      class="btn-pdf"
      onclick="baixarPDF()">

      📄 Baixar PDF

    </button>


    <button
      class="btn-alta"
      onclick="darAlta()">

      🏠 Dar Alta

    </button>

  </div>


  <br>


  <button onclick="salvar()">
    🐾 Salvar Consulta
  </button>

</div>


<script>

let triagensCarregadas = [];


/* ============================
   CARREGAR TRIAGENS
============================ */

function carregar() {

  fetch("/triagens")

    .then(r => r.json())

    .then(data => {

      triagensCarregadas = data;

      const div =
        document.getElementById("triagens");

      div.innerHTML = "";


      if (data.length === 0) {

        div.innerHTML =
          "<p style='color:#888; text-align:center;'>🐾 Nenhum paciente na fila.</p>";

        return;
      }


      data.forEach((t, index) => {

        div.innerHTML += `

          <div class="card">

            <h3>🐶 ${t.nome}</h3>

            <p>
              <b>🩺 Sintoma:</b>
              ${t.sintoma || "Não informado"}
            </p>

            <p>
              <b>🌡️ Temperatura:</b>
              ${t.temperatura || "Não informada"}°C
            </p>

            <p>
              <b>🚦 Risco:</b>
              ${t.risco || "Não informado"}
            </p>

            <p>
              <b>⚠️ Alergia:</b>
              ${t.alergia || "Nenhuma"}
            </p>

            <p>
              <b>📝 Observação:</b>
              ${t.observacao || "Nenhuma"}
            </p>

            <div style="
              display:flex;
              gap:8px;
              flex-wrap:wrap;
            ">

              <button onclick="selecionar(${index})">
                🐾 Atender
              </button>

              <button
                class="btn-tv"
                onclick="chamarNaTV('${t.nome}')">

                📺 Chamar na TV

              </button>

            </div>

          </div>

        `;

      });

    })

    .catch(error => {

      console.error(error);

      document.getElementById("triagens").innerHTML =
        "<p style='color:red;'>❌ Erro ao carregar pacientes.</p>";

    });

}


/* ============================
   CHAMAR NA TV
============================ */

function chamarNaTV(nome) {

  const consultorio =
    document.getElementById("consultorio-num").value || "01";


  fetch("/tv/chamar", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      localTipo: "CONSULTÓRIO",

      localNumero: consultorio,

      paciente: nome

    })

  })

  .then(r => r.json())

  .then(() => {

    alert(
      "✅ " +
      nome +
      " foi chamado na TV para o Consultório " +
      consultorio +
      "!"
    );

  })

  .catch(error => {

    console.error(error);

    alert(
      "❌ Erro ao chamar o paciente na TV."
    );

  });

}


/* ============================
   SELECIONAR PACIENTE
============================ */

function selecionar(index) {

  const t =
    triagensCarregadas[index];


  document.getElementById("paciente").value =
    t.nome;


  document.getElementById("obs").value =
    t.observacao || "";


  if (t.alergia && t.alergia !== "Nenhuma") {

    alert(
      "⚠️ Paciente possui alergia: " +
      t.alergia
    );

  }

}


/* ============================
   CARREGAR MEDICAÇÕES
============================ */

function carregarMedicacoes() {

  fetch("/lista-medicacoes")

    .then(r => r.json())

    .then(data => {

      const select =
        document.getElementById("medicacao");


      select.innerHTML =
        `<option value="">Selecione a medicação</option>`;


      data.forEach(med => {

        const option =
          document.createElement("option");

        option.value = med;

        option.textContent = med;

        select.appendChild(option);

      });

    })

    .catch(error => {

      console.error(error);

    });

}


/* ============================
   SALVAR CONSULTA
============================ */

function salvar() {

  const paciente =
    document.getElementById("paciente").value;

  const diagnostico =
    document.getElementById("diagnostico").value;

  const medicacao =
    document.getElementById("medicacao").value;

  const obs =
    document.getElementById("obs").value;


  if (!paciente) {

    alert(
      "Selecione um paciente clicando em Atender."
    );

    return;
  }


  if (!medicacao) {

    alert(
      "Selecione uma medicação."
    );

    return;
  }


  fetch("/consulta", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      paciente,
      diagnostico,
      medicacao,
      obs

    })

  })

  .then(r => r.json())

  .then(() => {

    alert(
      "🐾 Consulta salva com sucesso!"
    );

  })

  .catch(error => {

    console.error(error);

    alert(
      "❌ Erro ao salvar consulta."
    );

  });

}


/* ============================
   BAIXAR PDF
   ABRE ALTA.HTML
============================ */

function baixarPDF() {

  const paciente =
    document.getElementById("paciente").value.trim();

  const diagnostico =
    document.getElementById("diagnostico").value.trim();

  const medicacao =
    document.getElementById("medicacao").value.trim();

  const obs =
    document.getElementById("obs").value.trim();

  const motivo =
    document.getElementById("motivoAlta").value.trim();

  const assinatura =
    document.getElementById("assinatura").value.trim();


  if (!paciente) {

    alert(
      "⚠️ Selecione um paciente antes de gerar o PDF."
    );

    return;
  }


  if (!motivo) {

    alert(
      "⚠️ Digite o motivo da alta."
    );

    return;
  }


  if (!assinatura) {

    alert(
      "⚠️ Digite o nome do médico/veterinário."
    );

    return;
  }


  const parametros =
    new URLSearchParams({

      paciente: paciente,

      dataAlta:
        new Date().toLocaleDateString("pt-BR"),

      diagnostico:
        diagnostico || "Não informado",

      medicacao:
        medicacao || "Não informado",

      orientacoes:
        obs || "Não informado",

      retorno:
        "Não informado",

      motivo:
        motivo,

      assinatura:
        assinatura

    });


  window.open(
    "alta.html?" +
    parametros.toString(),
    "_blank"
  );

}


/* ============================
   DAR ALTA
============================ */

function darAlta() {

  const paciente =
    document.getElementById("paciente").value.trim();

  const diagnostico =
    document.getElementById("diagnostico").value.trim();

  const medicacao =
    document.getElementById("medicacao").value.trim();

  const obs =
    document.getElementById("obs").value.trim();

  const motivo =
    document.getElementById("motivoAlta").value.trim();

  const assinatura =
    document.getElementById("assinatura").value.trim();


  /* VERIFICA PACIENTE */

  if (!paciente) {

    alert(
      "⚠️ Selecione um paciente antes de dar alta."
    );

    return;
  }


  /* VERIFICA DIAGNÓSTICO */

  if (!diagnostico) {

    alert(
      "⚠️ Informe o diagnóstico antes de dar alta."
    );

    return;
  }


  /* VERIFICA MEDICAÇÃO */

  if (!medicacao) {

    alert(
      "⚠️ Selecione uma medicação antes de dar alta."
    );

    return;
  }


  /* VERIFICA MOTIVO */

  if (!motivo) {

    alert(
      "⚠️ Digite o motivo da alta."
    );

    return;
  }


  /* VERIFICA ASSINATURA */

  if (!assinatura) {

    alert(
      "⚠️ Digite o nome do médico/veterinário."
    );

    return;
  }


  /* CONFIRMAÇÃO */

  const confirmar =
    confirm(
      "🏠 Deseja realmente dar alta para " +
      paciente +
      "?"
    );


  if (!confirmar) {
    return;
  }


  /* ENVIA PARA O BACKEND */

  fetch("/alta", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      paciente: paciente,

      dataAlta:
        new Date().toISOString(),

      diagnostico:
        diagnostico,

      medicacao:
        medicacao,

      orientacoes:
        obs,

      motivo:
        motivo,

      retorno:
        "",

      medicoResponsavel:
        assinatura,

      assinatura:
        assinatura

    })

  })

  .then(r => {

    if (!r.ok) {

      throw new Error(
        "Erro ao dar alta"
      );

    }

    return r.json();

  })

  .then(() => {

    alert(
      "🏠 Alta realizada com sucesso para " +
      paciente +
      "!"
    );


    /* ABRE O RELATÓRIO DE ALTA */

    const parametros =
      new URLSearchParams({

        paciente: paciente,

        dataAlta:
          new Date().toLocaleDateString("pt-BR"),

        diagnostico:
          diagnostico,

        medicacao:
          medicacao,

        orientacoes:
          obs || "Não informado",

        retorno:
          "Não informado",

        motivo:
          motivo,

        assinatura:
          assinatura

      });


    window.open(
      "alta.html?" +
      parametros.toString(),
      "_blank"
    );


    /* LIMPA OS CAMPOS */

    document.getElementById("paciente").value = "";

    document.getElementById("diagnostico").value = "";

    document.getElementById("medicacao").value = "";

    document.getElementById("obs").value = "";

    document.getElementById("motivoAlta").value = "";

    document.getElementById("assinatura").value = "";


    carregar();

  })

  .catch(error => {

    console.error(error);

    alert(
      "❌ Erro ao dar alta no paciente."
    );

  });

}


/* ============================
   INICIALIZAÇÃO
============================ */

carregar();

carregarMedicacoes();

setInterval(carregar, 10000);

</script>

</body>
</html>
