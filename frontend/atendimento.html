<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>Atendimento Veterinário</title>

<link rel="stylesheet" href="style.css">

<style>

body {
    font-family: Arial, sans-serif;
    background: #DCEEFF;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 650px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

h2 {
    text-align: center;
    color: #2C5D8A;
    margin-bottom: 25px;
}

h3 {
    color: #2C5D8A;
    margin-top: 25px;
}

.formulario {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.formulario input,
.formulario select,
.formulario textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

.formulario textarea {
    min-height: 100px;
    resize: vertical;
}

label {
    color: #2C5D8A;
    font-weight: bold;
    margin-top: 8px;
}

/* TELEFONE */

.telefone {
    display: flex;
    gap: 8px;
}

.telefone select {
    width: 150px !important;
}

#ddd {
    width: 80px;
    flex-shrink: 0;
}

#telefone {
    flex: 1;
    min-width: 0;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    background: #5B9BD5;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #468CC7;
}

</style>

</head>

<body>

<div class="container">

<h2>🐶 Atendimento Veterinário</h2>

<div class="formulario">

<!-- ========================= -->
<!-- DADOS DO ANIMAL -->
<!-- ========================= -->

<h3>🐾 Dados do Animal</h3>

<input
    id="nomeAnimal"
    type="text"
    maxlength="50"
    placeholder="Nome do animal"
>

<label>Espécie</label>

<select id="especie">

    <option value="">
        Selecione a espécie
    </option>

    <option value="Cachorro">
        🐶 Cachorro
    </option>

    <option value="Gato">
        🐱 Gato
    </option>

    <option value="Coelho">
        🐰 Coelho
    </option>

    <option value="Ave">
        🦜 Ave
    </option>

    <option value="Outro">
        🐾 Outro
    </option>

</select>


<label>Raça</label>

<select id="raca">

    <option value="">
        Selecione a raça
    </option>

    <option>Labrador</option>
    <option>Golden Retriever</option>
    <option>Poodle</option>
    <option>Shih-tzu</option>
    <option>Yorkshire</option>
    <option>Bulldog Francês</option>
    <option>Bulldog Inglês</option>
    <option>Pastor Alemão</option>
    <option>Rottweiler</option>
    <option>Pinscher</option>
    <option>Chihuahua</option>
    <option>Dachshund</option>
    <option>Beagle</option>
    <option>Husky Siberiano</option>
    <option>Border Collie</option>
    <option>Vira-lata (SRD)</option>
    <option>Outra</option>

</select>


<label>Data de nascimento</label>

<input
    id="dataNascimento"
    type="date"
>


<label>Sexo</label>

<select id="sexo">

    <option value="">
        Selecione o sexo
    </option>

    <option value="Macho">
        Macho
    </option>

    <option value="Fêmea">
        Fêmea
    </option>

</select>


<label>Peso</label>

<input
    id="peso"
    type="number"
    min="0"
    step="0.1"
    placeholder="Peso em kg"
>


<label>Cor do pelo</label>

<select id="cor">

    <option value="">
        Selecione a cor do pelo
    </option>

    <option>Preto</option>
    <option>Branco</option>
    <option>Marrom</option>
    <option>Caramelo</option>
    <option>Cinza</option>
    <option>Bege</option>
    <option>Dourado</option>
    <option>Creme</option>
    <option>Preto e branco</option>
    <option>Marrom e branco</option>
    <option>Tricolor</option>
    <option>Outra</option>

</select>


<label>Tipo sanguíneo</label>

<select id="tipoSanguineo">

    <option value="">
        Selecione o tipo sanguíneo
    </option>

    <option value="DEA 1 positivo">
        DEA 1 positivo
    </option>

    <option value="DEA 1 negativo">
        DEA 1 negativo
    </option>

    <option value="Desconhecido">
        Desconhecido
    </option>

</select>


<label>Foto do animal</label>

<input
    type="file"
    id="foto"
    accept="image/*"
>


<!-- ========================= -->
<!-- DADOS DO TUTOR -->
<!-- ========================= -->

<h3>👤 Dados do Tutor</h3>

<input
    id="nomeTutor"
    type="text"
    maxlength="100"
    placeholder="Nome completo do tutor"
>


<label>CPF</label>

<input
    id="documentoTutor"
    type="text"
    inputmode="numeric"
    maxlength="11"
    placeholder="CPF (11 números)"
>


<label>Telefone</label>

<div class="telefone">

    <select id="codigoPais">

        <option value="+55">
            🇧🇷 Brasil +55
        </option>

        <option value="+1">
            🇺🇸 Estados Unidos +1
        </option>

        <option value="+1">
            🇨🇦 Canadá +1
        </option>

        <option value="+52">
            🇲🇽 México +52
        </option>

        <option value="+54">
            🇦🇷 Argentina +54
        </option>

        <option value="+56">
            🇨🇱 Chile +56
        </option>

        <option value="+57">
            🇨🇴 Colômbia +57
        </option>

        <option value="+351">
            🇵🇹 Portugal +351
        </option>

        <option value="+34">
            🇪🇸 Espanha +34
        </option>

        <option value="+33">
            🇫🇷 França +33
        </option>

        <option value="+49">
            🇩🇪 Alemanha +49
        </option>

        <option value="+39">
            🇮🇹 Itália +39
        </option>

        <option value="+41">
            🇨🇭 Suíça +41
        </option>

        <option value="+44">
            🇬🇧 Reino Unido +44
        </option>

        <option value="+81">
            🇯🇵 Japão +81
        </option>

        <option value="+86">
            🇨🇳 China +86
        </option>

        <option value="+61">
            🇦🇺 Austrália +61
        </option>

        <option value="+91">
            🇮🇳 Índia +91
        </option>

    </select>


    <input
        id="ddd"
        type="text"
        inputmode="numeric"
        maxlength="5"
        placeholder="DDD"
    >


    <input
        id="telefone"
        type="text"
        inputmode="numeric"
        maxlength="15"
        placeholder="Número"
    >

</div>


<input
    id="emailTutor"
    type="email"
    maxlength="100"
    placeholder="E-mail do tutor"
>


<input
    id="endereco"
    type="text"
    maxlength="150"
    placeholder="Endereço completo"
>


<input
    id="contatoEmergencia"
    type="text"
    maxlength="20"
    placeholder="Contato de emergência"
>


<!-- ========================= -->
<!-- INFORMAÇÕES DE SAÚDE -->
<!-- ========================= -->

<h3>🩺 Informações de Saúde</h3>

<label>Alergias</label>

<select id="alergias">

    <option value="">
        Selecione uma alergia
    </option>

    <option value="Nenhuma">
        Nenhuma alergia conhecida
    </option>

    <option value="Ração">
        Ração
    </option>

    <option value="Frango">
        Frango
    </option>

    <option value="Carne bovina">
        Carne bovina
    </option>

    <option value="Leite">
        Leite
    </option>

    <option value="Pulgas">
        Pulgas
    </option>

    <option value="Produtos de limpeza">
        Produtos de limpeza
    </option>

    <option value="Medicamentos">
        Medicamentos
    </option>

    <option value="Pólen">
        Pólen
    </option>

    <option value="Poeira">
        Poeira
    </option>

    <option value="Plantas">
        Plantas
    </option>

    <option value="Outra">
        Outra
    </option>

</select>


<textarea
    id="observacoes"
    maxlength="500"
    placeholder="Observações sobre o animal">
</textarea>


<!-- ========================= -->
<!-- TIPO DE ATENDIMENTO -->
<!-- ========================= -->

<h3>💳 Tipo de Atendimento</h3>

<select id="tipo">

    <option value="">
        Selecione o tipo de atendimento
    </option>

    <option value="Convenio">
        Convênio
    </option>

    <option value="Particular">
        Particular
    </option>

</select>


<button onclick="cadastrar()">
    🐾 Cadastrar Animal
</button>

</div>

</div>


<script>

function cadastrar() {

    /* ========================= */
    /* PEGAR OS DADOS */
    /* ========================= */

    const dados = {

        nomeAnimal:
            document.getElementById("nomeAnimal").value.trim(),

        especie:
            document.getElementById("especie").value,

        raca:
            document.getElementById("raca").value,

        dataNascimento:
            document.getElementById("dataNascimento").value,

        sexo:
            document.getElementById("sexo").value,

        peso:
            document.getElementById("peso").value,

        cor:
            document.getElementById("cor").value,

        tipoSanguineo:
            document.getElementById("tipoSanguineo").value,

        nomeTutor:
            document.getElementById("nomeTutor").value.trim(),

        documentoTutor:
            document.getElementById("documentoTutor").value
            .replace(/\D/g, ""),

        codigoPais:
            document.getElementById("codigoPais").value,

        ddd:
            document.getElementById("ddd").value
            .replace(/\D/g, ""),

        telefone:
            document.getElementById("telefone").value
            .replace(/\D/g, ""),

        emailTutor:
            document.getElementById("emailTutor").value.trim(),

        endereco:
            document.getElementById("endereco").value.trim(),

        contatoEmergencia:
            document.getElementById("contatoEmergencia").value.trim(),

        alergias:
            document.getElementById("alergias").value,

        observacoes:
            document.getElementById("observacoes").value.trim(),

        tipo:
            document.getElementById("tipo").value

    };


    /* ========================= */
    /* VALIDAÇÕES */
    /* ========================= */

    if (!dados.nomeAnimal) {

        alert("⚠️ Informe o nome do animal.");

        return;
    }


    if (!dados.especie) {

        alert("⚠️ Selecione a espécie.");

        return;
    }


    if (!dados.raca) {

        alert("⚠️ Selecione a raça.");

        return;
    }


    if (!dados.sexo) {

        alert("⚠️ Selecione o sexo.");

        return;
    }


    if (!dados.nomeTutor) {

        alert("⚠️ Informe o nome do tutor.");

        return;
    }


    /* ========================= */
    /* VALIDAÇÃO DO CPF */
    /* ========================= */

    if (dados.documentoTutor.length !== 11) {

        alert(
            "⚠️ O CPF deve ter exatamente 11 números."
        );

        return;
    }


    /* ========================= */
    /* VALIDAÇÃO DO DDD */
    /* ========================= */

    if (
        dados.ddd.length < 1 ||
        dados.ddd.length > 5
    ) {

        alert(
            "⚠️ O DDD/código regional deve ter de 1 a 5 números."
        );

        return;
    }


    /* ========================= */
    /* VALIDAÇÃO DO TELEFONE */
    /* ========================= */

    if (
        dados.telefone.length < 6 ||
        dados.telefone.length > 15
    ) {

        alert(
            "⚠️ O telefone deve ter entre 6 e 15 números."
        );

        return;
    }


    /* ========================= */
    /* ENVIO PARA O SERVIDOR */
    /* ========================= */

    fetch(
        "http://localhost:3000/atendimento",
        {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(dados)

        }
    )

    .then(async resposta => {

        const texto =
            await resposta.text();

        if (!resposta.ok) {

            throw new Error(
                texto ||
                "Erro no servidor."
            );

        }

        return texto
            ? JSON.parse(texto)
            : {};

    })

    .then(() => {

        alert(
            "🐶✅ Animal cadastrado com sucesso!"
        );

        document
            .querySelector(".formulario")
            .reset();

    })

    .catch(erro => {

        console.error(
            "Erro completo:",
            erro
        );

        alert(
            "❌ Erro ao cadastrar o animal.\n\n" +
            erro.message
        );

    });

}

</script>

</body>

</html>
