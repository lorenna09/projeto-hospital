<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>Atendimento Veterinário</title>
<link rel="stylesheet" href="style.css">

<style>

body {
    font-family: Arial, sans-serif;
    background: #DCEEFF;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 600px;
    margin: 40px auto;
    background: rgba(255, 255, 255, 0.98);
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

h2 {
    text-align: center;
    color: #2C5D8A;
    margin-bottom: 25px;
}

h3 {
    color: #2C5D8A;
    margin-top: 25px;
}

.formulario {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.formulario input,
.formulario select,
.formulario textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

.formulario textarea {
    min-height: 100px;
    resize: vertical;
}

label {
    color: #2C5D8A;
    font-weight: bold;
    margin-top: 10px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    background: #5B9BD5;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #468CC7;
}

</style>

</head>

<body>

<div class="container">

<h2>🐶 Atendimento Veterinário</h2>

<div class="formulario">

<h3>🐾 Dados do Animal</h3>

<input id="nomeAnimal" placeholder="Nome do animal">

<label>Espécie</label>

<select id="especie">
    <option value="">Selecione a espécie</option>
    <option value="Cachorro">🐶 Cachorro</option>
    <option value="Gato">🐱 Gato</option>
    <option value="Coelho">🐰 Coelho</option>
    <option value="Ave">🦜 Ave</option>
    <option value="Outro">🐾 Outro</option>
</select>

<label>Raça</label>

<select id="raca">
    <option value="">Selecione a raça</option>
    <option value="Labrador">Labrador</option>
    <option value="Golden Retriever">Golden Retriever</option>
    <option value="Poodle">Poodle</option>
    <option value="Shih-tzu">Shih-tzu</option>
    <option value="Yorkshire">Yorkshire</option>
    <option value="Bulldog Francês">Bulldog Francês</option>
    <option value="Bulldog Inglês">Bulldog Inglês</option>
    <option value="Pastor Alemão">Pastor Alemão</option>
    <option value="Rottweiler">Rottweiler</option>
    <option value="Pinscher">Pinscher</option>
    <option value="Chihuahua">Chihuahua</option>
    <option value="Dachshund (Salsicha)">Dachshund (Salsicha)</option>
    <option value="Beagle">Beagle</option>
    <option value="Husky Siberiano">Husky Siberiano</option>
    <option value="Border Collie">Border Collie</option>
    <option value="Vira-lata (SRD)">Vira-lata (SRD)</option>
    <option value="Outra">Outra</option>
</select>

<label>Data de nascimento</label>

<input id="dataNascimento" type="date">

<label>Sexo</label>

<select id="sexo">
    <option value="">Selecione o sexo</option>
    <option value="Macho">Macho</option>
    <option value="Fêmea">Fêmea</option>
</select>

<input id="peso" type="number" step="0.1" placeholder="Peso (kg)">

<label>Cor do pelo</label>

<select id="cor">
    <option value="">Selecione a cor do pelo</option>
    <option value="Preto">⚫ Preto</option>
    <option value="Branco">⚪ Branco</option>
    <option value="Marrom">🟤 Marrom</option>
    <option value="Caramelo">🟤 Caramelo</option>
    <option value="Cinza">🩶 Cinza</option>
    <option value="Bege">Bege</option>
    <option value="Dourado">Dourado</option>
    <option value="Creme">Creme</option>
    <option value="Preto e branco">Preto e branco</option>
    <option value="Marrom e branco">Marrom e branco</option>
    <option value="Tricolor">Tricolor</option>
    <option value="Outra">Outra</option>
</select>

<label>Foto do animal</label>

<input type="file" id="foto">

<h3>👤 Dados do Tutor</h3>

<input id="nomeTutor" placeholder="Nome do tutor">

<input id="documentoTutor" placeholder="CPF do tutor">

<input id="telefoneTutor" placeholder="Telefone do tutor">

<input id="emailTutor" type="email" placeholder="E-mail do tutor">

<input id="endereco" placeholder="Endereço">

<input id="contatoEmergencia" placeholder="Contato de emergência">

<h3>🩺 Informações de Saúde</h3>

<label>Alergias</label>

<select id="alergias">
    <option value="">Selecione uma alergia</option>
    <option value="Nenhuma">Nenhuma alergia conhecida</option>
    <option value="Ração">Ração</option>
    <option value="Frango">Frango</option>
    <option value="Carne bovina">Carne bovina</option>
    <option value="Leite">Leite</option>
    <option value="Pulgas">Pulgas</option>
    <option value="Produtos de limpeza">Produtos de limpeza</option>
    <option value="Medicamentos">Medicamentos</option>
    <option value="Pólen">Pólen</option>
    <option value="Poeira">Poeira</option>
    <option value="Plantas">Plantas</option>
    <option value="Outra">Outra</option>
</select>



<textarea id="observacoes" placeholder="Observações"></textarea>

<h3>💳 Tipo de Atendimento</h3>

<select id="tipo">
    <option value="">Selecione o tipo de atendimento</option>
    <option value="Convenio">Convênio</option>
    <option value="Particular">Particular</option>
</select>

<button onclick="cadastrar()">
    🐾 Cadastrar Animal
</button>

</div>

</div>

<script>

function cadastrar(){

    const dados = {

        nomeAnimal: document.getElementById("nomeAnimal").value,

        especie: document.getElementById("especie").value,

        raca: document.getElementById("raca").value,

        dataNascimento: document.getElementById("dataNascimento").value,

        sexo: document.getElementById("sexo").value,

        peso: document.getElementById("peso").value,

        cor: document.getElementById("cor").value,

        nomeTutor: document.getElementById("nomeTutor").value,

        documentoTutor: document.getElementById("documentoTutor").value,

        telefoneTutor: document.getElementById("telefoneTutor").value,

        emailTutor: document.getElementById("emailTutor").value,

        endereco: document.getElementById("endereco").value,

        contatoEmergencia: document.getElementById("contatoEmergencia").value,

        alergias: document.getElementById("alergias").value,

        observacoes: document.getElementById("observacoes").value,

        tipo: document.getElementById("tipo").value

    };

    fetch("http://localhost:3000/atendimento", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(dados)

    })
    .then(r => r.json())
    .then(data => {

        alert("🐶✅ Animal cadastrado e enviado para a triagem!");

    })
    .catch(error => {

        alert("❌ Erro ao cadastrar o animal.");

        console.error(error);

    });

}

</script>

</body>
</html>
