<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Sistema Hospitalar</title>
  <link rel="stylesheet" href="style.css">

  <style>
  body {
  font-family: Arial, sans-serif;
  background: #DCEEFF;
  margin: 0; 
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 90%;
  max-width: 450px;
  background: white;
  padding: 35px;
  border-radius: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.12);
  text-align: center;
}

/* Regra unificada para a logo circular perfeita */
.logo, .container img {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  margin: 0 auto 15px auto;
  
  /* Amplia a imagem interna para cortar as bordas brancas quadradas */
  transform: scale(1.35); 
}

h2 {
  color: #2C5D8A;
  margin-bottom: 25px;
}
.slogan {
  color: #2C5D8A;
  font-size: 14px;
  font-weight: bold;
  font-style: italic;
  margin-bottom: 25px;
}
input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  margin-top: 12px;
  border: 1px solid #C8D8E8;
  border-radius: 8px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 20px;
  background: #5B9BD5;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #468CC7;
}
  </style>
</head>

<body>

  <div class="container">

    <!-- COLOQUE SUA IMAGEM COMO logo.png -->
    <img src="foto1.png" alt="Logo Hospital do Snoopy" class="logo">

    <h2> Hospital do Snoopy</h2>
<p class="slogan">Cuidando com Afeto e Alegria</p>
    <input id="usuario" placeholder="Usuário">

    <input
      id="senha"
      type="password"
      placeholder="Senha">

    <button onclick="login()">Entrar</button>

  </div>

<script>
    async function login() {

        const usuario = document.getElementById("usuario").value.trim();
        const senha = document.getElementById("senha").value.trim();

        if (!usuario || !senha) {
            alert("Digite o usuário e a senha!");
            return;
        }

        try {

            const resposta = await fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    usuario: usuario,
                    senha: senha
                })
            });

            const data = await resposta.json();

            if (!resposta.ok) {
                alert(data.mensagem || "Usuário ou senha incorretos!");
                return;
            }

            if (data.tipo === "triagem") {
                location.href = "triagem.html";
            } 
            else if (data.tipo === "medico") {
                location.href = "medico.html";
            } 
            else if (data.tipo === "atendimento") {
                location.href = "atendimento.html";
            } 
            else if (data.tipo === "almoxarifado") {
                location.href = "almoxarifado.html";
            } 
            else {
                alert("Tipo de usuário não reconhecido!");
            }

        } catch (erro) {
            alert("Não foi possível conectar ao servidor. Tente novamente.");
            console.error("Erro no login:", erro);
        }
    }
</script>

</body>
</html>
