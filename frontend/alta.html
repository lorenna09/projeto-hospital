<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Relatório de Alta</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #EEF5FB;
      font-family: Arial, sans-serif;
      color: #1f3b56;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      background: white;
      padding: 45px;
      min-height: 100vh;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      border-radius: 0 0 18px 18px;
    }

    h1 {
      text-align: center;
      color: #4F7CAC;
      margin-top: 0;
      margin-bottom: 40px;
      font-size: 36px;
    }

    .linha {
      display: flex;
      border-bottom: 1px solid #ddd;
      padding: 16px 0;
      font-size: 22px;
    }

    .linha strong {
      width: 255px;
      flex-shrink: 0;
    }

    .valor {
      flex: 1;
    }

    .motivo {
      margin-top: 35px;
    }

    .motivo strong {
      display: block;
      font-size: 22px;
      margin-bottom: 12px;
    }

    .motivo-texto {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      min-height: 90px;
      font-size: 21px;
      white-space: pre-wrap;
    }

    .assinatura {
      margin-top: 90px;
      text-align: center;
      font-size: 20px;
    }

    .linha-assinatura {
      width: 420px;
      max-width: 90%;
      border-top: 1px solid #222;
      margin: 0 auto 10px;
    }

    #nomeMedico {
      font-weight: bold;
      margin: 5px 0;
      font-size: 21px;
    }

    .texto-assinatura {
      margin: 5px 0;
    }

    .botoes {
      text-align: center;
      margin-top: 50px;
    }

    .btn-pdf {
      background: #4F7CAC;
      color: white;
      border: none;
      padding: 15px 28px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-pdf:hover {
      background: #3E668C;
    }

    @media print {

      body {
        background: white;
      }

      .container {
        box-shadow: none;
        border-radius: 0;
        max-width: 100%;
        padding: 30px;
      }

      .botoes {
        display: none !important;
      }

      h1 {
        color: #4F7CAC !important;
      }

    }

  </style>
</head>


<body>

  <div class="container">

    <h1>
      Relatório de Alta
    </h1>


    <div class="linha">

      <strong>Paciente:</strong>

      <span
        class="valor"
        id="paciente">
        Não informado
      </span>

    </div>


    <div class="linha">

      <strong>Data da alta:</strong>

      <span
        class="valor"
        id="dataAlta">
        Não informado
      </span>

    </div>


    <div class="linha">

      <strong>Diagnóstico:</strong>

      <span
        class="valor"
        id="diagnostico">
        Não informado
      </span>

    </div>


    <div class="linha">

      <strong>Medicação / Conduta:</strong>

      <span
        class="valor"
        id="medicacao">
        Não informado
      </span>

    </div>


    <div class="linha">

      <strong>Orientações:</strong>

      <span
        class="valor"
        id="orientacoes">
        Não informado
      </span>

    </div>


    <div class="linha">

      <strong>Retorno:</strong>

      <span
        class="valor"
        id="retorno">
        Não informado
      </span>

    </div>


    <!-- MOTIVO DA ALTA -->

    <div class="motivo">

      <strong>
        Motivo da alta:
      </strong>

      <div
        class="motivo-texto"
        id="motivo">
        Não informado
      </div>

    </div>


    <!-- ASSINATURA -->

    <div class="assinatura">

      <div class="linha-assinatura"></div>

      <p id="nomeMedico">
        Médico/Veterinário
      </p>

      <p class="texto-assinatura">
        Assinatura do médico/veterinário
      </p>

    </div>


    <!-- BOTÃO -->

    <div class="botoes">

      <button
        class="btn-pdf"
        onclick="window.print()">

        ⬇️ Baixar PDF

      </button>

    </div>

  </div>


  <script>

    /* PEGA OS DADOS ENVIADOS PELO MEDICO.HTML */

    const parametros =
      new URLSearchParams(
        window.location.search
      );


    document.getElementById("paciente").textContent =
      parametros.get("paciente") ||
      "Não informado";


    document.getElementById("dataAlta").textContent =
      parametros.get("dataAlta") ||
      "Não informado";


    document.getElementById("diagnostico").textContent =
      parametros.get("diagnostico") ||
      "Não informado";


    document.getElementById("medicacao").textContent =
      parametros.get("medicacao") ||
      "Não informado";


    document.getElementById("orientacoes").textContent =
      parametros.get("orientacoes") ||
      "Não informado";


    document.getElementById("retorno").textContent =
      parametros.get("retorno") ||
      "Não informado";


    /* MOTIVO DA ALTA */

    document.getElementById("motivo").textContent =
      parametros.get("motivo") ||
      "Não informado";


    /* NOME DO MÉDICO/VETERINÁRIO */

    document.getElementById("nomeMedico").textContent =
      parametros.get("assinatura") ||
      "Médico/Veterinário";

  </script>

</body>

</html>
