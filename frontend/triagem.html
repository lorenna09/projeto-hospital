
<script type="module">
import { pipeline, env } from
  "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";

const botao = document.getElementById("btnSalvar");
const resultado = document.getElementById("resultado");

let classificador = null;

async function carregarIA() {
  if (!classificador) {
    resultado.style.display = "block";
    resultado.className = "amarelo";
    resultado.textContent =
      "Carregando o modelo de IA pela primeira vez. Aguarde...";

    classificador = await pipeline(
      "zero-shot-classification",
      "Xenova/mobilebert-uncased-mnli",
      { quantized: true }
    );
  }
  return classificador;
}

function detectarEmergencia(texto, sintoma) {
  const textoNormalizado = texto.toLowerCase();

  const sintomasGraves = [
    "dificuldade para respirar",
    "não consegue respirar",
    "convulsão",
    "sangramento intenso",
    "inconsciente",
    "desmaiou",
    "gengiva azul",
    "veneno",
    "intoxicação"
  ];

  return (
    ["falta_ar", "convulsao", "hemorragia"].includes(sintoma) ||
    sintomasGraves.some(s => textoNormalizado.includes(s))
  );
}

async function salvar() {
  const dados = {
    nomeAnimal: document.getElementById("nomeAnimal").value.trim(),
    especie: document.getElementById("especie").value,
    raca: document.getElementById("raca").value,
    dataNascimento: document.getElementById("dataNascimento").value,
    sexo: document.getElementById("sexo").value,
    peso: document.getElementById("peso").value,
    cor: document.getElementById("cor").value,
    tipoSanguineo: document.getElementById("tipoSanguineo").value,
    sintoma: document.getElementById("sintoma").value,
    alergia: document.getElementById("alergia").value,
    temperatura: document.getElementById("temp").value,
    observacao: document.getElementById("observacao").value.trim()
  };

  if (!dados.nomeAnimal || !dados.especie || !dados.sintoma) {
    alert("Preencha o nome, a espécie e o problema do animal.");
    return;
  }

  botao.disabled = true;
  botao.textContent = "Analisando com IA...";

  try {
    const ia = await carregarIA();

    const texto = `
      Espécie: ${dados.especie}.
      Sintoma selecionado: ${dados.sintoma}.
      Temperatura: ${dados.temperatura || "não informada"} °C.
      Alergias: ${dados.alergia || "não informadas"}.
      Observações: ${dados.observacao || "nenhuma"}.
    `;

    const analise = await ia(texto, [
      "emergência veterinária com risco imediato",
      "caso veterinário que precisa de avaliação rápida",
      "caso veterinário aparentemente estável"
    ]);

    let risco = "amarelo";
    let justificativa = "A IA não consegue confirmar a gravidade apenas pelo formulário. Procure orientação veterinária.";

    const classe = analise.labels[0];

    if (classe.includes("emergência")) {
      risco = "vermelho";
      justificativa = "A análise identificou características que podem indicar emergência. Procure atendimento veterinário imediatamente.";
    } else if (classe.includes("estável")) {
      risco = "verde";
      justificativa = "O modelo classificou o relato como aparentemente estável. Isso não descarta doenças nem substitui avaliação veterinária.";
    } else {
      risco = "amarelo";
      justificativa = "O relato pode exigir avaliação veterinária rápida. A gravidade precisa ser confirmada por um profissional.";
    }

    if (detectarEmergencia(texto, dados.sintoma)) {
      risco = "vermelho";
      justificativa = "Foi identificado um sinal potencialmente grave. Procure atendimento veterinário de emergência.";
    }

    dados.risco = risco;
    dados.justificativaRisco = justificativa;
    dados.confiancaModelo = analise.scores[0];

    const historico = JSON.parse(
      localStorage.getItem("triagensVeterinarias") || "[]"
    );

    historico.push({
      ...dados,
      dataTriagem: new Date().toISOString()
    });

    localStorage.setItem(
      "triagensVeterinarias",
      JSON.stringify(historico)
    );

    resultado.className = risco;
    resultado.replaceChildren();

    const titulo = document.createElement("h3");
    titulo.textContent = "Índice de risco: " + risco.toUpperCase();

    const explicacao = document.createElement("p");
    explicacao.textContent = justificativa;

    resultado.append(titulo, explicacao);
    resultado.style.display = "block";

  } catch (erro) {
    console.error(erro);
    resultado.style.display = "block";
    resultado.className = "amarelo";
    resultado.textContent =
      "Não foi possível carregar a IA. Verifique a internet e abra a página por um servidor local. A classificação não foi concluída.";
  } finally {
    botao.disabled = false;
    botao.textContent = "🐾 Analisar e Salvar Triagem";
  }
}

window.salvar = salvar;
</script>
