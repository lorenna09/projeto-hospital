
<script>
async function salvar() {
  const resultado = document.getElementById("resultado");

  const dados = {
    nomeAnimal: document.getElementById("nomeAnimal").value.trim(),
    especie: document.getElementById("especie").value,
    raca: document.getElementById("raca").value,
    dataNascimento: document.getElementById("dataNascimento").value,
    sexo: document.getElementById("sexo").value,
    peso: document.getElementById("peso").value,
    cor: document.getElementById("cor").value,
    tipoSanguineo: document.getElementById("tipoSanguineo").value,
    sintoma: document.getElementById("sintoma").value,
    temperatura: document.getElementById("temp").value === ""
      ? null
      : Number(document.getElementById("temp").value),
    alergia: document.getElementById("alergia").value,
    observacao: document.getElementById("observacao").value.trim()
  };

  if (!dados.nomeAnimal || !dados.especie || !dados.sintoma) {
    alert("Preencha o nome, a espécie e o problema do animal.");
    return;
  }

  const botao = document.querySelector('button[onclick="salvar()"]');

  botao.disabled = true;
  botao.textContent = "Analisando triagem...";
  resultado.className = "";
  resultado.textContent = "A IA está analisando os dados informados.";

  try {
    // 1. Solicita a análise da IA ao servidor
    const respostaIA = await fetch(
      "http://localhost:3000/triagem/interpretar",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
      }
    );

    const analise = await respostaIA.json();

    if (!respostaIA.ok) {
      throw new Error(analise.erro || "Não foi possível analisar a triagem.");
    }

    const niveisValidos = ["verde", "amarelo", "vermelho"];

    if (!niveisValidos.includes(analise.risco)) {
      throw new Error("A IA retornou uma classificação inválida.");
    }

    // 2. Exibe o resultado da análise
    dados.risco = analise.risco;
    dados.justificativaRisco = analise.justificativa;
    dados.sinaisAlerta = analise.sinaisAlerta || [];

    resultado.className = analise.risco;
    resultado.replaceChildren();

    const titulo = document.createElement("h3");
    titulo.textContent =
      "Risco sugerido: " + analise.risco.toUpperCase();

    const justificativa = document.createElement("p");
    justificativa.textContent =
      analise.justificativa || "Sem justificativa disponível.";

    resultado.append(titulo, justificativa);

    if (dados.sinaisAlerta.length > 0) {
      const alertas = document.createElement("p");
      alertas.textContent =
        "Sinais de alerta: " + dados.sinaisAlerta.join(", ");
      resultado.appendChild(alertas);
    }

    const aviso = document.createElement("p");
    aviso.textContent =
      "A classificação é um apoio à triagem e precisa ser avaliada " +
      "por um profissional veterinário.";
    resultado.appendChild(aviso);

    // 3. Salva os dados e a análise no sistema existente
    const respostaSalvar = await fetch(
      "http://localhost:3000/triagem",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
      }
    );

    if (!respostaSalvar.ok) {
      throw new Error("A análise foi feita, mas não foi possível salvar a triagem.");
    }

    alert("Triagem analisada e salva com sucesso!");

  } catch (erro) {
    console.error("Erro na triagem:", erro);

    resultado.className = "amarelo";
    resultado.textContent =
      "Não foi possível concluir a análise e salvar a triagem. " +
      "Verifique o servidor e tente novamente. " + erro.message;

    alert("Erro: " + erro.message);
  } finally {
    botao.disabled = false;
    botao.textContent = "🐾 Salvar Triagem";
  }
}
</script>
