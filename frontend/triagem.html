
<script>
function classificarRisco(sintoma, temperatura, observacao) {
  const relato = (observacao || "").toLowerCase();

  const emergencia = [
    "falta_ar",
    "convulsao",
    "hemorragia"
  ];

  const sinaisGraves = [
    "dificuldade para respirar",
    "não consegue respirar",
    "nao consegue respirar",
    "sangramento intenso",
    "inconsciente",
    "desmaiou",
    "veneno",
    "intoxicação",
    "intoxicacao"
  ];

  if (
    emergencia.includes(sintoma) ||
    sinaisGraves.some(sinal => relato.includes(sinal))
  ) {
    return "vermelho";
  }

  if (temperatura && temperatura >= 40) {
    return "vermelho";
  }

  if (temperatura && temperatura >= 39) {
    return "amarelo";
  }

  if (
    ["febre", "vomito", "diarreia", "acidente", "dor"].includes(sintoma)
  ) {
    return "amarelo";
  }

  return "verde";
}

async function salvar() {
  const resultado = document.getElementById("resultado");

  try {
    const dados = {
      nomeAnimal: document.getElementById("nomeAnimal").value.trim(),
      especie: document.getElementById("especie").value,
      raca: document.getElementById("raca").value,
      dataNascimento: document.getElementById("dataNascimento").value,
      sexo: document.getElementById("sexo").value,
      peso: document.getElementById("peso").value,
      cor: document.getElementById("cor").value,
      tipoSanguineo: document.getElementById("tipoSanguineo").value,
      sintoma: document.getElementById("sintoma").value,
      temperatura: Number(document.getElementById("temp").value) || null,
      alergia: document.getElementById("alergia").value,
      observacao: document.getElementById("observacao").value.trim()
    };

    if (!dados.nomeAnimal || !dados.especie || !dados.sintoma) {
      alert("Preencha o nome, a espécie e o problema do animal.");
      return;
    }

    const risco = classificarRisco(
      dados.sintoma,
      dados.temperatura,
      dados.observacao
    );

    dados.risco = risco;

    resultado.className = risco;
    resultado.textContent =
      "Classificação de risco: " + risco.toUpperCase();
    resultado.style.display = "block";

    try {
      const resposta = await fetch("http://localhost:3000/triagem", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
      });

      if (!resposta.ok) {
        throw new Error("Servidor indisponível.");
      }

      alert("Triagem classificada e salva com sucesso!");
    } catch (erroServidor) {
      alert(
        "Risco classificado na página, mas não foi possível salvar. " +
        "Verifique se o servidor está ligado."
      );
    }
  } catch (erro) {
    console.error(erro);
    alert("Ocorreu um erro. Abra o console do navegador para verificar.");
  }
}
</script>
