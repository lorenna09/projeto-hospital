
<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Triagem Veterinária</title>
<link rel="stylesheet" href="style.css">

<style>

body{
  font-family: Arial, sans-serif;
  background:#DCEEFF;
  margin:0;
}

.container{
  width:90%;
  max-width:900px;
  margin:40px auto;
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
  color:#2C5D8A;
  margin-bottom:25px;
}

h3{
  color:#2C5D8A;
  margin-top:25px;
}

input,
select,
textarea{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  width:100%;
  padding:13px;
  margin-top:20px;
  background:#5B9BD5;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#468CC7;
}

#resultado{
  margin-top:20px;
  padding:15px;
  border-radius:8px;
  font-weight:bold;
  text-align:center;
}

.verde{
  background:#2ecc71;
  color:white;
}

.amarelo{
  background:#f1c40f;
  color:#333;
}

.vermelho{
  background:#e74c3c;
  color:white;
}

#analiseIA{
  margin-top:20px;
  padding:15px;
  border:1px solid #B9D8F5;
  border-radius:10px;
  background:#F0F7FF;
}

#textoIA{
  color:#333;
  line-height:1.6;
}

</style>

</head>

<body>

<div class="container">

<h2>🐾 Triagem Veterinária</h2>

<h3>🐶 Dados do Animal</h3>

<input id="nomeAnimal" placeholder="Nome do animal">

<select id="especie">
  <option value="">Selecione a espécie</option>
  <option value="Cachorro">🐶 Cachorro</option>
  <option value="Gato">🐱 Gato</option>
  <option value="Coelho">🐰 Coelho</option>
  <option value="Ave">🦜 Ave</option>
  <option value="Outro">🐾 Outro</option>
</select>

<select id="raca">
  <option value="">Selecione a raça</option>
  <option>Labrador</option>
  <option>Golden Retriever</option>
  <option>Poodle</option>
  <option>Shih-tzu</option>
  <option>Yorkshire</option>
  <option>Bulldog Francês</option>
  <option>Pastor Alemão</option>
  <option>Rottweiler</option>
  <option>Pinscher</option>
  <option>Chihuahua</option>
  <option>Dachshund</option>
  <option>Beagle</option>
  <option>Husky Siberiano</option>
  <option>Border Collie</option>
  <option>Vira-lata (SRD)</option>
  <option>Outra</option>
</select>

<input id="dataNascimento" type="date">

<select id="sexo">
  <option value="">Selecione o sexo</option>
  <option value="Macho">Macho</option>
  <option value="Fêmea">Fêmea</option>
</select>

<input id="peso" type="number" step="0.1" placeholder="Peso (kg)">

<select id="cor">
  <option value="">Selecione a cor do pelo</option>
  <option>Preto</option>
  <option>Branco</option>
  <option>Marrom</option>
  <option>Caramelo</option>
  <option>Cinza</option>
  <option>Bege</option>
  <option>Dourado</option>
  <option>Creme</option>
  <option>Preto e branco</option>
  <option>Marrom e branco</option>
  <option>Tricolor</option>
  <option>Outra</option>
</select>

<select id="tipoSanguineo">
  <option value="">Tipo sanguíneo</option>
  <option value="DEA 1 positivo">DEA 1 positivo</option>
  <option value="DEA 1 negativo">DEA 1 negativo</option>
  <option value="Desconhecido">Desconhecido</option>
</select>

<h3>🩺 Informações de Saúde</h3>

<select id="sintoma">
  <option value="">Selecione o problema</option>
  <option value="dor">Dor</option>
  <option value="febre">Febre</option>
  <option value="vomito">Vômito</option>
  <option value="diarreia">Diarreia</option>
  <option value="falta_ar">Dificuldade para respirar</option>
  <option value="convulsao">Convulsão</option>
  <option value="hemorragia">Hemorragia</option>
  <option value="acidente">Acidente</option>
  <option value="outro">Outro</option>
</select>

<select id="alergia">
  <option value="">Selecione a alergia</option>
  <option value="Nenhuma">Nenhuma alergia conhecida</option>
  <option value="Ração">Ração</option>
  <option value="Frango">Frango</option>
  <option value="Carne bovina">Carne bovina</option>
  <option value="Leite">Leite</option>
  <option value="Pulgas">Pulgas</option>
  <option value="Medicamentos">Medicamentos</option>
  <option value="Pólen">Pólen</option>
  <option value="Poeira">Poeira</option>
  <option value="Plantas">Plantas</option>
  <option value="Outra">Outra</option>
</select>

<input id="temp" type="number" step="0.1" placeholder="Temperatura (°C)">

<textarea id="observacao" placeholder="Observações"></textarea>

<!-- Resultado da classificação -->
<div id="resultado"></div>

<!-- Área de análise da IA -->
<div id="analiseIA">
  <h3 style="margin-top:0;">🤖 Análise inteligente da triagem</h3>

  <p id="textoIA">
    Preencha os dados de saúde e clique no botão abaixo para analisar.
  </p>

  <button type="button" onclick="analisarComIA()">
    🤖 Analisar risco do animal
  </button>

  <small style="display:block;margin-top:12px;color:#555;">
    Análise demonstrativa. A classificação deve ser revisada por um veterinário.
  </small>
</div>

<button onclick="salvar()">
  🐾 Salvar Triagem
</button>

</div>

<script>

function classificarRisco(sintoma, temperatura, observacao){

  const texto = observacao.toLowerCase();

  const sinaisGraves = [
    "convulsao",
    "hemorragia",
    "falta_ar"
  ];

  const sinaisGravesTexto = [
    "dificuldade para respirar",
    "não consegue respirar",
    "nao consegue respirar",
    "desmai",
    "inconsciente",
    "sangramento intenso",
    "intoxicação",
    "intoxicacao",
    "gengiva azulada"
  ];

  const sinaisModerados = [
    "febre",
    "vomito",
    "diarreia",
    "acidente",
    "dor"
  ];

  if(
    sinaisGraves.includes(sintoma) ||
    sinaisGravesTexto.some(sinal => texto.includes(sinal)) ||
    temperatura >= 40
  ){
    return {
      risco:"vermelho",
      motivo:"Possíveis sinais de emergência. O animal precisa de avaliação veterinária imediata."
    };
  }

  if(
    sinaisModerados.includes(sintoma) ||
    (temperatura >= 39.5 && temperatura < 40) ||
    (temperatura > 0 && temperatura < 37.5) ||
    texto.trim() !== ""
  ){
    return {
      risco:"amarelo",
      motivo:"Os dados indicam a necessidade de avaliação veterinária prioritária."
    };
  }

  return {
    risco:"verde",
    motivo:"As regras demonstrativas não identificaram sinais de alerta nos dados informados. Isso não descarta problemas de saúde."
  };
}


// IA demonstrativa: analisa os dados preenchidos.
function analisarComIA(){

  const sintoma = document.getElementById("sintoma").value;
  const temperaturaCampo = document.getElementById("temp").value;
  const temperatura = Number(temperaturaCampo);
  const observacao = document.getElementById("observacao").value;

  const textoIA = document.getElementById("textoIA");
  const resultado = document.getElementById("resultado");

  if(!sintoma){
    textoIA.textContent = "Selecione o problema ou sintoma do animal antes de realizar a análise.";
    return;
  }

  const analise = classificarRisco(
    sintoma,
    temperatura,
    observacao
  );

  window.analiseAtual = analise;

  resultado.className = analise.risco;
  resultado.textContent =
    "Risco sugerido: " + analise.risco.toUpperCase();

  textoIA.textContent =
    "Classificação sugerida: " + analise.risco.toUpperCase() +
    ". " + analise.motivo;
}


// Salva a triagem no backend existente.
function salvar(){

  const dados = {

    nomeAnimal: document.getElementById("nomeAnimal").value,
    especie: document.getElementById("especie").value,
    raca: document.getElementById("raca").value,
    dataNascimento: document.getElementById("dataNascimento").value,
    sexo: document.getElementById("sexo").value,
    peso: document.getElementById("peso").value,
    cor: document.getElementById("cor").value,
    tipoSanguineo: document.getElementById("tipoSanguineo").value,
    sintoma: document.getElementById("sintoma").value,
    temperatura: Number(document.getElementById("temp").value),
    alergia: document.getElementById("alergia").value,
    observacao: document.getElementById("observacao").value

  };

  if(!dados.sintoma){
    alert("Selecione o problema ou sintoma do animal.");
    return;
  }

  // Analisa novamente para garantir que os dados atuais sejam usados.
  const analise = classificarRisco(
    dados.sintoma,
    dados.temperatura,
    dados.observacao
  );

  dados.risco = analise.risco;
  dados.motivoRisco = analise.motivo;
  dados.origemClassificacao = "regras_demonstrativas";
  dados.requerRevisaoVeterinaria = true;

  const confirmar = confirm(
    "Classificação sugerida: " + dados.risco.toUpperCase() +
    "\n\nMotivo: " + dados.motivoRisco +
    "\n\nA classificação precisa ser revisada por um veterinário.\n\nDeseja salvar a triagem?"
  );

  if(!confirmar){
    return;
  }

  fetch("http://localhost:3000/triagem", {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify(dados)

  })

  .then(async resposta => {

    const texto = await resposta.text();

    if(!resposta.ok){
      throw new Error(texto || "Erro ao salvar a triagem.");
    }

    return texto ? JSON.parse(texto) : {};

  })

  .then(() => {

    const resultado = document.getElementById("resultado");

    resultado.className = dados.risco;
    resultado.textContent =
      "Classificação sugerida: " + dados.risco.toUpperCase();

    document.getElementById("textoIA").textContent =
      "Análise registrada. " + dados.motivoRisco;

    alert("🐶✅ Triagem salva com sucesso!");

  })

  .catch(erro => {

    console.error(erro);

    alert(
      "❌ Erro ao salvar a triagem.\n\n" +
      erro.message
    );

  });

}

</script>

</body>
</html>
